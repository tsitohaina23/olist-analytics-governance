name: olist_governance
version: "1.0.0"
config-version: 2
profile: olist_governance

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # chemins relatifs au dossier depuis lequel dbt est lancé (la racine du dépôt)
  raw_path: "data/raw"
  # fenêtre d'analyse : mois complets uniquement (2016 et sept.-oct. 2018 sont incomplets)
  analysis_start: "2017-01-01"
  analysis_end: "2018-08-31"

models:
  olist_governance:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    quality:
      +schema: quality
      +materialized: table

seeds:
  olist_governance:
    +schema: reference
